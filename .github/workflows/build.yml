name: Build Windows exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: choco install tesseract -y --no-progress
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python tools/prepare_vendor.py
      - run: pyinstaller --noconfirm OfflineOCR.spec
      - run: Compress-Archive -Path dist/OfflineOCR -DestinationPath OfflineOCR-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: OfflineOCR-windows, path: OfflineOCR-windows.zip }
